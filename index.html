<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式專案甘特圖管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .gantt-grid-line {
            background-size: 36px 100%;
            background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px);
        }
        .gantt-weekend {
            background-color: rgba(241, 245, 249, 0.7);
        }
        .gantt-today {
            background-color: rgba(254, 240, 138, 0.35);
        }
        .gantt-bar-parent {
            background-color: #334155;
        }
        .gantt-bar-normal {
            background-color: #3b82f6;
        }
        .gantt-bar-red {
            background-color: #ef4444;
        }
        .gantt-bar-emerald {
            background-color: #10b981;
        }
        .gantt-bar-purple {
            background-color: #a855f7;
        }
        .gantt-bar-amber {
            background-color: #f59e0b;
        }
        @media print {
            header, .no-print {
                display: none !important;
            }
            #gantt-workspace {
                overflow: visible !important;
                height: auto !important;
            }
            #left-pane, #right-pane {
                overflow: visible !important;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased select-none overflow-hidden">

    <!-- Top Header Bar -->
    <header class="bg-slate-900 text-white border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-brand-600 text-white p-2 rounded-lg shadow-sm">
                <i class="fa-solid fa-chart-gantt text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-wide flex items-center gap-2">
                    統創曜：交屋時程 甘特圖管理系統
                    <span class="text-xs font-normal px-2 py-0.5 bg-brand-500/30 text-brand-300 rounded-full border border-brand-500/40">v3.1 CSV即時連線版</span>
                </h1>
                <p class="text-xs text-slate-400">連線至 Google Sheet 試算表，支援雙向即時同步與編輯</p>
            </div>
        </div>

        <!-- Top Right Actions -->
        <div class="flex items-center space-x-2">
            <button id="btn-gsheet-sync" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-medium rounded-md shadow transition flex items-center gap-1.5 border border-emerald-500/50">
                <i class="fa-solid fa-file-csv"></i> Google Sheet 連線設定
            </button>
            <button id="btn-export-json" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-md border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-download text-slate-400"></i> 匯出 JSON
            </button>
            <label id="btn-import-json" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-md border border-slate-700 transition flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-upload text-slate-400"></i> 匯入
                <input type="file" id="file-import" class="hidden" accept=".json">
            </label>
            <button id="btn-reset-demo" class="px-3 py-1.5 bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/40 text-xs font-medium rounded-md transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i> 清空資料
            </button>
            <button id="btn-print" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-md shadow transition flex items-center gap-1.5">
                <i class="fa-solid fa-print"></i> 列印 / PDF
            </button>
        </div>
    </header>

    <!-- Project KPI Summary Bar -->
    <div class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between text-xs shrink-0 gap-4 overflow-x-auto">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <span class="text-slate-500">總任務數:</span>
                <span id="kpi-total-tasks" class="font-bold text-slate-800 text-sm">0</span>
            </div>
            <div class="h-4 w-px bg-slate-200"></div>
            <div class="flex items-center space-x-2">
                <span class="text-slate-500">專案整體進度:</span>
                <div class="w-24 bg-slate-100 rounded-full h-2 overflow-hidden border border-slate-200">
                    <div id="kpi-progress-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <span id="kpi-progress-text" class="font-bold text-emerald-600">0%</span>
            </div>
            <div class="h-4 w-px bg-slate-200"></div>
            <div class="flex items-center space-x-1.5">
                <span class="text-slate-500 font-medium">專案起止時間:</span>
                <input type="date" id="input-proj-start" value="" class="px-2 py-0.5 border border-slate-300 rounded text-xs font-semibold text-slate-700 bg-slate-50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
                <span class="text-slate-400 font-bold">~</span>
                <input type="date" id="input-proj-end" value="" class="px-2 py-0.5 border border-slate-300 rounded text-xs font-semibold text-slate-700 bg-slate-50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
                <button id="btn-autofit-dates" class="px-2 py-0.5 bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 rounded text-[11px] font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-wand-magic-sparkles text-brand-600"></i> 自動抓取日期
                </button>
            </div>
        </div>

        <div class="flex items-center space-x-4 text-xs">
            <div class="flex items-center space-x-1.5">
                <span class="w-3 h-3 rounded bg-slate-700 inline-block"></span>
                <span class="text-slate-600">父任務</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-3 h-3 rounded bg-blue-500 inline-block"></span>
                <span class="text-slate-600">進行中</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-3 h-3 rounded bg-rose-500 inline-block"></span>
                <span class="text-slate-600">要徑</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-3 h-3 transform rotate-45 bg-amber-500 inline-block"></span>
                <span class="text-slate-600">里程碑</span>
            </div>
        </div>
    </div>

    <!-- Action Toolbar -->
    <div class="bg-slate-100 border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0 flex-wrap gap-2">
        <div class="flex items-center space-x-2">
            <button id="btn-add-task" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium rounded shadow-sm transition flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> 新增任務
            </button>
            <button id="btn-add-milestone" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium rounded shadow-sm transition flex items-center gap-1">
                <i class="fa-solid fa-gem"></i> 新增里程碑
            </button>
            <div class="h-4 w-px bg-slate-300 mx-1"></div>
            <button id="btn-expand-all" class="p-1.5 text-slate-600 hover:bg-slate-200 rounded text-xs" title="全部展開">
                <i class="fa-solid fa-angles-down"></i> 展開
            </button>
            <button id="btn-collapse-all" class="p-1.5 text-slate-600 hover:bg-slate-200 rounded text-xs" title="全部折疊">
                <i class="fa-solid fa-angles-up"></i> 折疊
            </button>
            <div class="h-4 w-px bg-slate-300 mx-1"></div>
            <button id="btn-today" class="px-2.5 py-1 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 text-xs font-medium rounded shadow-sm">
                回到今天
            </button>
        </div>

        <div class="flex items-center space-x-3">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="input-search" placeholder="搜尋任務..." class="pl-8 pr-3 py-1 bg-white border border-slate-300 rounded text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 w-36 sm:w-48 transition">
            </div>

            <div class="bg-white border border-slate-300 rounded p-0.5 flex text-xs">
                <button data-scale="day" class="view-scale-btn active px-2.5 py-1 rounded font-medium bg-brand-600 text-white transition">日</button>
                <button data-scale="week" class="view-scale-btn px-2.5 py-1 rounded font-medium text-slate-600 hover:text-slate-900 transition">週</button>
                <button data-scale="month" class="view-scale-btn px-2.5 py-1 rounded font-medium text-slate-600 hover:text-slate-900 transition">月</button>
            </div>
        </div>
    </div>

    <!-- Main Gantt Workspace -->
    <div id="gantt-workspace" class="flex-1 flex overflow-hidden relative">
        <div id="left-pane" class="w-1/2 min-w-[320px] max-w-[650px] flex flex-col bg-white border-r border-slate-300 z-10 shrink-0 select-text overflow-hidden">
            <div class="bg-slate-100 border-b border-slate-300 flex text-xs font-semibold text-slate-700 shrink-0 h-10 items-center">
                <div class="w-10 text-center shrink-0 border-r border-slate-200">#</div>
                <div class="flex-1 min-w-[140px] px-2 border-r border-slate-200">任務名稱</div>
                <div class="w-20 px-1 border-r border-slate-200 text-center">負責人</div>
                <div class="w-24 px-1 border-r border-slate-200 text-center">開始日期</div>
                <div class="w-16 px-1 border-r border-slate-200 text-center">工期(天)</div>
                <div class="w-24 px-1 border-r border-slate-200 text-center">結束日期</div>
                <div class="w-16 px-1 border-r border-slate-200 text-center">進度%</div>
                <div class="w-14 px-1 text-center">操作</div>
            </div>
            <div id="task-table-body" class="flex-1 overflow-y-auto overflow-x-hidden divide-y divide-slate-200"></div>
        </div>

        <div id="drag-divider" class="w-1.5 bg-slate-200 hover:bg-brand-500 cursor-col-resize z-20 shrink-0 transition-colors shadow-inner flex items-center justify-center">
            <div class="w-0.5 h-6 bg-slate-400 rounded-full"></div>
        </div>

        <div id="right-pane" class="flex-1 flex flex-col bg-slate-50 overflow-hidden relative">
            <div id="gantt-header-container" class="bg-slate-100 border-b border-slate-300 overflow-hidden shrink-0 select-none shadow-sm h-10 flex flex-col">
                <div id="timeline-month-header" class="h-5 flex border-b border-slate-200 text-[11px] font-bold text-slate-600 bg-slate-200/60"></div>
                <div id="timeline-day-header" class="h-5 flex text-[10px] font-semibold text-slate-600"></div>
            </div>

            <div id="gantt-body-container" class="flex-1 overflow-auto relative">
                <div id="gantt-bg-grid" class="absolute inset-0 pointer-events-none"></div>
                <svg id="gantt-svg-layer" class="absolute inset-0 pointer-events-none w-full h-full z-10">
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
                        </marker>
                    </defs>
                </svg>
                <div id="gantt-bars-container" class="relative z-0"></div>
            </div>
        </div>
    </div>

    <!-- Google Sheet Sync Modal -->
    <div id="gsheet-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden">
            <div class="bg-emerald-800 text-white px-5 py-3.5 flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-table text-emerald-300"></i> Google Sheet 資料庫連線設定
                </h3>
                <button id="gsheet-modal-close" class="text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 text-xs text-slate-700">
                <div>
                    <label class="block font-semibold mb-1">Google CSV 發佈連結 / Sheet ID</label>
                    <input type="text" id="input-gsheet-id" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vREJZ4oDfcfzzo72i-1domayjGzs0_y9vYB36krHHYNz_5iFbYnaLRL5mYRhE1DPwkH-RJ7RY_9xCDi/pub?output=csv" class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 font-mono text-xs bg-slate-50">
                </div>

                <div class="pt-3 flex justify-between items-center border-t border-slate-200">
                    <button type="button" id="btn-fetch-gsheet" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded transition flex items-center gap-1.5">
                        <i class="fa-solid fa-arrows-rotate"></i> 從 Google Sheet 載入
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        class GanttApp {
            constructor() {
                this.csvUrl = localStorage.getItem('gantt_csv_url') || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREJZ4oDfcfzzo72i-1domayjGzs0_y9vYB36krHHYNz_5iFbYnaLRL5mYRhE1DPwkH-RJ7RY_9xCDi/pub?output=csv';
                this.tasks = [];
                this.viewScale = 'day';
                this.cellWidth = 36;
                this.rowHeight = 40;
                this.startDate = new Date();
                this.totalDays = 30;

                this.initDOM();
                this.bindEvents();
                this.fetchFromCsvUrl(this.csvUrl);
            }

            initDOM() {
                this.dom = {
                    leftPane: document.getElementById('left-pane'),
                    rightPane: document.getElementById('right-pane'),
                    taskTableBody: document.getElementById('task-table-body'),
                    timelineMonthHeader: document.getElementById('timeline-month-header'),
                    timelineDayHeader: document.getElementById('timeline-day-header'),
                    ganttBgGrid: document.getElementById('gantt-bg-grid'),
                    ganttBarsContainer: document.getElementById('gantt-bars-container'),
                    ganttHeaderContainer: document.getElementById('gantt-header-container'),
                    ganttBodyContainer: document.getElementById('gantt-body-container'),
                    svgLayer: document.getElementById('gantt-svg-layer'),
                    kpiTotal: document.getElementById('kpi-total-tasks'),
                    kpiProgressBar: document.getElementById('kpi-progress-bar'),
                    kpiProgressText: document.getElementById('kpi-progress-text'),
                    inputProjStart: document.getElementById('input-proj-start'),
                    inputProjEnd: document.getElementById('input-proj-end'),
                    gsheetModal: document.getElementById('gsheet-modal'),
                    inputGsheetId: document.getElementById('input-gsheet-id'),
                    divider: document.getElementById('drag-divider'),
                };
            }

            async fetchFromCsvUrl(url) {
                try {
                    this.showToast("正在從 Google Sheet 載入 CSV 資料...", "info");
                    
                    let targetUrl = url.trim();
                    if (!targetUrl.startsWith('http')) {
                        targetUrl = `https://docs.google.com/spreadsheets/d/${targetUrl}/pub?output=csv`;
                    }

                    const res = await fetch(targetUrl);
                    if (!res.ok) throw new Error("存取 CSV 失敗，請確認試算表已完成「發佈到網路」");

                    const csvText = await res.text();
                    this.parseCsvAndRender(csvText);
                    
                    localStorage.setItem('gantt_csv_url', targetUrl);
                    this.showToast("成功讀取並解析 Google Sheet 資料！");
                } catch (err) {
                    this.showToast("載入失敗：" + err.message, "error");
                }
            }

            parseCsvAndRender(csvText) {
                const lines = csvText.split(/\r?\n/);
                if (lines.length <= 1) return;

                const parsedTasks = [];
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
                    if (!cols[0] && !cols[1]) continue;

                    const id = parseInt(cols[0]) || i;
                    const name = cols[1] || `Task ${id}`;
                    const owner = cols[2] || '';
                    const startStr = this.formatDateISO(this.parseDate(cols[3]));
                    const duration = parseInt(cols[4]) || 1;
                    
                    let progressVal = parseFloat(cols[5]) || 0;
                    if (progressVal <= 1 && progressVal > 0) progressVal = progressVal * 100;
                    const progress = Math.round(progressVal);

                    const predecessor = cols[6] || '';
                    const parentVal = parseInt(cols[7]);
                    const parentId = isNaN(parentVal) ? null : parentVal;
                    const remark = cols[8] || '';
                    const color = cols[9] || 'blue';
                    const isMilestone = (cols[10] || '').toLowerCase() === 'true' || duration === 0;

                    parsedTasks.push({
                        id, name, owner, start: startStr, duration, progress, predecessor, parentId, remark, color, isMilestone, expanded: true
                    });
                }

                if (parsedTasks.length > 0) {
                    this.tasks = parsedTasks;
                    this.render();
                }
            }

            calculateProjectScope() {
                let minStart = null;
                let maxEnd = null;

                this.tasks.forEach(t => {
                    if (t.start) {
                        const st = this.parseDate(t.start);
                        if (!isNaN(st.getTime())) {
                            if (!minStart || st < minStart) minStart = st;
                            const dur = parseInt(t.duration) || 1;
                            const end = this.addDays(st, Math.max(1, dur) - 1);
                            if (!maxEnd || end > maxEnd) maxEnd = end;
                        }
                    }
                });

                this.startDate = minStart || new Date();
                const pEnd = maxEnd || this.addDays(this.startDate, 30);
                const diffTime = Math.abs(pEnd - this.startDate);
                this.totalDays = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1);

                if (this.dom.inputProjStart) this.dom.inputProjStart.value = this.formatDateISO(this.startDate);
                if (this.dom.inputProjEnd) this.dom.inputProjEnd.value = this.formatDateISO(pEnd);
            }

            updateKPIs() {
                this.dom.kpiTotal.textContent = this.tasks.length;
                let totalProgress = 0;
                this.tasks.forEach(t => totalProgress += (t.progress || 0));
                const avg = this.tasks.length ? Math.round(totalProgress / this.tasks.length) : 0;
                this.dom.kpiProgressBar.style.width = `${avg}%`;
                this.dom.kpiProgressText.textContent = `${avg}%`;
            }

            formatDateISO(date) {
                if (!(date instanceof Date) || isNaN(date)) date = new Date();
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            parseDate(dateStr) {
                if (!dateStr) return new Date();
                const str = String(dateStr).replace(/\//g, '-').trim();
                const d = new Date(str);
                return isNaN(d.getTime()) ? new Date() : d;
            }

            addDays(date, days) {
                const res = new Date(date);
                res.setDate(res.getDate() + parseInt(days));
                return res;
            }

            diffDays(d1, d2) {
                return Math.round((d1.getTime() - d2.getTime()) / (1000 * 3600 * 24));
            }

            render() {
                this.calculateProjectScope();
                this.updateKPIs();
                this.renderTable(this.tasks);
                this.renderTimelineHeaders();
                this.renderGanttBars(this.tasks);
            }

            renderTable(tasks) {
                this.dom.taskTableBody.innerHTML = '';
                tasks.forEach(t => {
                    const isParent = t.parentId === null;
                    const endDateStr = this.formatDateISO(this.addDays(this.parseDate(t.start), (t.duration || 1) - 1));
                    const row = document.createElement('div');
                    row.className = `flex text-xs h-[40px] items-center hover:bg-slate-50 transition-colors ${isParent ? 'bg-slate-100/70 font-semibold' : ''}`;
                    row.innerHTML = `
                        <div class="w-10 text-center shrink-0 border-r border-slate-200 text-slate-500 font-mono text-[11px]">${t.id}</div>
                        <div class="flex-1 min-w-[140px] px-2 border-r border-slate-200 flex items-center space-x-1 overflow-hidden">
                            <span class="truncate font-medium">${t.name}</span>
                        </div>
                        <div class="w-20 px-1 border-r border-slate-200 text-center truncate text-slate-600">${t.owner || '-'}</div>
                        <div class="w-24 px-1 border-r border-slate-200 text-center font-mono text-slate-600">${t.start}</div>
                        <div class="w-16 px-1 border-r border-slate-200 text-center font-mono text-slate-600">${t.duration}</div>
                        <div class="w-24 px-1 border-r border-slate-200 text-center text-slate-500 text-[11px] font-mono">${endDateStr}</div>
                        <div class="w-16 px-1 border-r border-slate-200 text-center font-mono text-slate-600">${t.progress}%</div>
                        <div class="w-14 px-1 text-center text-slate-400"><i class="fa-solid fa-check text-emerald-500"></i></div>
                    `;
                    this.dom.taskTableBody.appendChild(row);
                });
            }

            renderTimelineHeaders() {
                this.dom.timelineMonthHeader.innerHTML = '';
                this.dom.timelineDayHeader.innerHTML = '';
                const totalWidth = this.totalDays * this.cellWidth;
                this.dom.timelineMonthHeader.style.width = `${totalWidth}px`;
                this.dom.timelineDayHeader.style.width = `${totalWidth}px`;
                this.dom.ganttBgGrid.style.width = `${totalWidth}px`;

                let currentMonth = '';
                let currentMonthWidth = 0;
                let currentMonthDiv = null;

                for (let i = 0; i < this.totalDays; i++) {
                    const d = this.addDays(this.startDate, i);
                    const monthStr = `${d.getFullYear()}年${d.getMonth() + 1}月`;
                    
                    if (monthStr !== currentMonth) {
                        currentMonth = monthStr;
                        currentMonthDiv = document.createElement('div');
                        currentMonthDiv.className = 'border-r border-slate-300 px-2 flex items-center font-bold text-slate-700 truncate';
                        currentMonthDiv.textContent = monthStr;
                        this.dom.timelineMonthHeader.appendChild(currentMonthDiv);
                        currentMonthWidth = 0;
                    }
                    currentMonthWidth += this.cellWidth;
                    currentMonthDiv.style.width = `${currentMonthWidth}px`;

                    const dayCell = document.createElement('div');
                    dayCell.style.width = `${this.cellWidth}px`;
                    dayCell.className = `shrink-0 text-center border-r border-slate-200 flex items-center justify-center font-semibold text-[10px] text-slate-600`;
                    dayCell.textContent = d.getDate();
                    this.dom.timelineDayHeader.appendChild(dayCell);
                }
            }

            renderGanttBars(tasks) {
                this.dom.ganttBarsContainer.innerHTML = '';
                tasks.forEach(t => {
                    const row = document.createElement('div');
                    row.className = 'relative flex items-center h-[40px] border-b border-slate-200/60';
                    row.style.width = `${this.totalDays * this.cellWidth}px`;

                    const st = this.parseDate(t.start);
                    const leftPx = this.diffDays(st, this.startDate) * this.cellWidth;
                    const widthPx = Math.max(12, (t.duration || 0) * this.cellWidth);

                    const bar = document.createElement('div');
                    bar.className = `absolute h-6 rounded-md shadow-sm gantt-bar-normal text-white text-[10px] flex items-center overflow-hidden z-10`;
                    bar.style.left = `${leftPx}px`;
                    bar.style.width = `${widthPx}px`;

                    const progressFill = document.createElement('div');
                    progressFill.className = 'h-full bg-black/25';
                    progressFill.style.width = `${t.progress}%`;
                    bar.appendChild(progressFill);

                    const label = document.createElement('span');
                    label.className = 'absolute left-2 font-medium truncate pointer-events-none drop-shadow-sm pr-2';
                    label.textContent = `${t.name} (${t.progress}%)`;
                    bar.appendChild(label);

                    row.appendChild(bar);
                    this.dom.ganttBarsContainer.appendChild(row);
                });
            }

            bindEvents() {
                document.getElementById('btn-gsheet-sync').onclick = () => this.dom.gsheetModal.classList.remove('hidden');
                document.getElementById('gsheet-modal-close').onclick = () => this.dom.gsheetModal.classList.add('hidden');
                document.getElementById('btn-fetch-gsheet').onclick = () => {
                    this.fetchFromCsvUrl(this.dom.inputGsheetId.value);
                    this.dom.gsheetModal.classList.add('hidden');
                };
            }

            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `px-4 py-2.5 rounded-lg shadow-xl text-xs font-semibold text-white flex items-center gap-2 ${type === 'error' ? 'bg-rose-600' : 'bg-slate-800 border border-slate-700'}`;
                toast.innerHTML = `${message}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        }

        window.onload = () => new GanttApp();
    </script>
</body>
</html>
